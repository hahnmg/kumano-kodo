<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:comment>A band of the page: its ground and the space around it; the content goes in the slot.</f:comment>
<f:argument name="tone" type="string" optional="{true}" default="paper" description="Ground: paper or sunk."/>
<f:argument name="space" type="string" optional="{true}" default="default" description="Space above and below: default, large, flush-top or none."/>
<f:argument name="bleed" type="bool|int" optional="{true}" default="{false}" description="Lets a rail run to the edge of the viewport."/>
<f:argument name="label" type="string" optional="{true}" description="Accessible name, when the section has no visible heading."/>
<f:argument name="id" type="string" optional="{true}" description="Anchor to link to the section."/>

<f:variable name="class">section section-{tone} section-space-{space}{f:if(condition: bleed, then: ' section-bleed')}</f:variable>
<k:element tag="section" attributes="{class: class, aria-label: label, id: id}">
    <div class="section-inner">
        <f:slot/>
    </div>
</k:element>
</html>
