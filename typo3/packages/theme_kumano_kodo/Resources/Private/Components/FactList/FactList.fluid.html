<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:comment>Pairs of label and value under an optional heading.</f:comment>
<f:argument name="facts" type="iterable" description="Entries with label and value."/>
<f:argument name="title" type="string" optional="{true}" description="The heading."/>

<f:asset.css identifier="kumano-fact-list" href="EXT:theme_kumano_kodo/Resources/Public/Css/Components/fact-list.css"/>
<div class="fact-list fact-list-inline">
    <f:if condition="{title}">
        <h2 class="fact-list-title type-h4">{title}</h2>
    </f:if>
    <dl class="fact-list-items">
        <f:for each="{facts}" as="fact">
            <div class="fact-list-row">
                <dt class="type-caption">{fact.label}</dt>
                <dd class="type-small">{fact.value}</dd>
            </div>
        </f:for>
    </dl>
</div>
</html>
