<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:comment>A short warning with an icon; the title as an argument, the text in the slot. Its styles ship in global.css.</f:comment>
<f:argument name="title" type="string|TYPO3Fluid\Fluid\Core\Parser\UnsafeHTML" description="The title, set before the text."/>

<div class="notice" role="note">
    <kk:icon name="alert" size="24"/>
    <div class="notice-body">
        <strong class="notice-title type-label">{title}</strong>
        <div class="notice-text type-small">
            <f:slot/>
        </div>
    </div>
</div>
</html>
