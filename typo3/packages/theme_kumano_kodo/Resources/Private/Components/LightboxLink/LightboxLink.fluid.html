<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:comment>An image that opens large in the lightbox; place it inside a lightboxGroup. A video plays there.</f:comment>
<f:argument name="image" type="mixed" description="A file or file reference, or a video as k:media gives it."/>
<f:argument name="class" type="string" optional="{true}" description="Class of the img element."/>
<f:argument name="sizes" type="string" optional="{true}" default="(width <= 900px) 100vw, 50vw" description="As for image."/>

<f:if condition="{image.video}">
    <f:then>
        <a class="lightbox-link" href="{image.video.publicUrl}" data-lightbox aria-haspopup="dialog" aria-label="{f:translate(key: 'playVideo', domain: 'theme_kumano_kodo.messages')}: {image.poster.alternative}">
            <f:if condition="{image.poster}">
                <kk:image image="{image.poster}" class="{class}" sizes="{sizes}"/>
            </f:if>
            <span class="video-badge" aria-hidden="true">
                <kk:icon name="play" size="24"/>
            </span>
            <template class="video-source">
                <f:media file="{image.video}" width="{image.width}" height="{image.height}" class="video-player"/>
            </template>
            <kk:videoConsent video="{image.video}"/>
        </a>
    </f:then>
    <f:else>
        <a class="lightbox-link" href="{image.publicUrl}" data-lightbox aria-haspopup="dialog">
            <kk:image image="{image}" class="{class}" sizes="{sizes}"/>
        </a>
    </f:else>
</f:if>
</html>
