<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>A text link in the accent with an arrow: forward by default, back with direction back.</f:comment>
<f:comment>Generated by scripts/build-typo3.mjs from the Storybook markup; edit it there.</f:comment>
<f:argument name="label" type="string|TYPO3Fluid\Fluid\Core\Parser\UnsafeHTML" description="The text."/>
<f:argument name="href" type="string" description="The target."/>
<f:argument name="direction" type="string" optional="{true}" default="forward" description="forward or back."/>

<f:if condition="{direction} == 'back'">
    <f:then>
        <a class="link link-back type-button" href="{href}"><span class="link-arrow" aria-hidden="true">←</span> <span class="link-label">{label}</span></a>
    </f:then>
    <f:else>
        <a class="link link-forward type-button" href="{href}"><span class="link-label">{label}</span> <span class="link-arrow" aria-hidden="true">→</span></a>
    </f:else>
</f:if>
</html>
