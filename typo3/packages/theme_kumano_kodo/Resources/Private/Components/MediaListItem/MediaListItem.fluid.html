<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:comment>One row of a mediaList.</f:comment>
<f:argument name="title" type="string" description="The heading of the row."/>
<f:argument name="href" type="string" description="The target."/>
<f:argument name="meta" type="string" optional="{true}" description="A short line below."/>
<f:argument name="image" type="object" optional="{true}" description="A file or file reference, shown round."/>

<li>
    <a class="media-list-row" href="{href}">
        <f:if condition="{image}">
            <kk:image image="{image}" class="avatar avatar-small" sizes="56px" width="56" height="56"/>
        </f:if>
        <span class="media-list-text">
            <span class="type-h4">{title}</span>
            <span class="media-list-meta type-caption">{meta}</span>
        </span>
        <span class="icon-circle">
            <kk:icon name="arrow-right" size="24"/>
        </span>
    </a>
</li>
</html>
