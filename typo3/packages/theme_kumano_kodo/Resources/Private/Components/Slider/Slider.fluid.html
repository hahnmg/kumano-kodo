<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:comment>Cards in a row that scrolls, with arrows beside the heading and dots below; the cards go in the slot.</f:comment>
<f:argument name="title" type="string|TYPO3Fluid\Fluid\Core\Parser\UnsafeHTML" description="The heading, also the name of the card row."/>
<f:argument name="count" type="string|int" description="Number of cards, for the dots."/>
<f:argument name="eyebrow" type="string|TYPO3Fluid\Fluid\Core\Parser\UnsafeHTML" optional="{true}" description="Short line above the heading."/>

<f:asset.css identifier="kumano-slider" href="EXT:theme_kumano_kodo/Resources/Public/Css/Components/slider.css"/>
<f:asset.script identifier="kumano-slider" src="EXT:theme_kumano_kodo/Resources/Public/JavaScript/slider.js" type="module"/>
<f:variable name="card">{f:translate(key: 'card', domain: 'theme_kumano_kodo.messages')}</f:variable>
<div class="slider" data-slider>
    <kk:sectionHeading title="{title}" eyebrow="{eyebrow}" controls="{true}"/>
    <div class="rail slider-track" tabindex="0" role="group" aria-label="{title -> f:format.stripTags() -> f:format.htmlentitiesDecode()}">
        <f:slot/>
    </div>
    <div class="slider-indicator">
        <div class="slider-dots">
            <f:for each="{f:range(start: 1, end: count)}" as="n" iteration="i">
                <f:if condition="{i.isFirst}">
                    <f:then>
                        <button class="slider-dots-dot" type="button" aria-label="{card} {n}" aria-current="true"></button>
                    </f:then>
                    <f:else>
                        <button class="slider-dots-dot" type="button" aria-label="{card} {n}"></button>
                    </f:else>
                </f:if>
            </f:for>
        </div>
    </div>
</div>
</html>
