<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:comment>One entry of the Cards element, as the card of its variant.</f:comment>
<f:variable name="href">{f:uri.typolink(parameter: card.link)}</f:variable>
<f:switch expression="{data.tx_themekumanokodo_variant}">
    <f:case value="place">
        <f:comment>The editor's "ruled" is the card below a pair: the default card with rule and tall photo.</f:comment>
        <f:variable name="ruled" value="{f:if(condition: '{card.emphasis} == ruled', then: 1, else: 0)}"/>
        <kk:featureCard
            image="{card.image -> f:first()}"
            title="{card -> f:render.text(field: 'title')}"
            text="{card -> f:render.text(field: 'text')}"
            emphasis="{f:if(condition: '{card.emphasis} == featured', then: 'featured', else: 'default')}"
            rule="{ruled}"
            tall="{ruled}"
        />
    </f:case>
    <f:case value="person">
        <kk:personCard image="{card.image -> f:first()}" name="{card -> f:render.text(field: 'title')}" role="{card -> f:render.text(field: 'meta')}" focus="{card -> f:render.text(field: 'text')}"/>
    </f:case>
    <f:case value="cta">
        <kk:ctaCard
            title="{card -> f:render.text(field: 'title')}"
            text="{card -> f:render.text(field: 'text')}"
            linkLabel="{f:if(condition: card.link_label, then: '{card -> f:render.text(field: \'link_label\')}', else: '{f:translate(key: \'readMore\', domain: \'theme_kumano_kodo.messages\')}')}"
            href="{href}"
            variant="{f:if(condition: '{card.emphasis} == featured', then: 'featured', else: 'default')}"
            edge="{data.tx_themekumanokodo_edge}"
        />
    </f:case>
    <f:case value="tile">
        <kk:linkTile title="{card -> f:render.text(field: 'title')}" href="{href}" icon="{card.icon}" edge="{data.tx_themekumanokodo_edge}"/>
    </f:case>
    <f:case value="stage">
        <kk:portraitCard image="{card.image -> f:first()}" label="{card -> f:render.text(field: 'label')}" meta="{card -> f:render.text(field: 'meta')}" title="{card -> f:render.text(field: 'title')}" href="{href}" text="{card -> f:render.text(field: 'text')}"/>
    </f:case>
    <f:defaultCase>
        <kk:teaserCard image="{card.image -> f:first()}" title="{card -> f:render.text(field: 'title')}" subtitle="{card -> f:render.text(field: 'text')}" meta="{card -> f:render.text(field: 'meta')}" badge="{card -> f:render.text(field: 'badge')}" href="{href}" edge="{data.tx_themekumanokodo_edge}" level="{f:if(condition: '{data.header} && {data.header_layout} != 100', then: 3, else: 2)}"/>
    </f:defaultCase>
</f:switch>
</html>
