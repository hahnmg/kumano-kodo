<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:layout name="Content/Default"/>
<f:section name="Main">
    <f:if condition="{data.colPos} == 20">
        <f:then>
            <div class="site-footer-about type-small">{record -> f:render.text(field: 'bodytext')}</div>
        </f:then>
        <f:else>
            <f:variable name="body">
                <kk:richText>
                    {record -> f:render.text(field: 'bodytext')}
                </kk:richText>
            </f:variable>
            <f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 1, bleed: 0, body: body}"/>
        </f:else>
    </f:if>
</f:section>
</html>
