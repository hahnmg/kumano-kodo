<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:layout name="Content/Default"/>
<f:section name="Main">
    <f:if condition="{data.tx_themekumanokodo_columns} == 'slider'">
        <f:then>
            <f:variable name="body">
                <kk:slider title="{record -> f:render.text(field: 'header')}" eyebrow="{record -> f:render.text(field: 'subheader')}" count="{record.tx_themekumanokodo_entries -> f:count()}">
                    <f:for each="{record.tx_themekumanokodo_entries}" as="card">
                        <f:render partial="Kumano/Card" arguments="{card: card, data: data}"/>
                    </f:for>
                </kk:slider>
            </f:variable>
            <f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 0, bleed: 1, body: body}"/>
        </f:then>
        <f:else>
            <f:variable name="body">
                <f:if condition="{record.tx_themekumanokodo_entries -> f:count()} == 1">
                    <f:then>
                        <f:for each="{record.tx_themekumanokodo_entries}" as="card">
                            <f:render partial="Kumano/Card" arguments="{card: card, data: data}"/>
                        </f:for>
                    </f:then>
                    <f:else>
                        <kk:grid columns="{data.tx_themekumanokodo_columns}">
                            <f:for each="{record.tx_themekumanokodo_entries}" as="card">
                                <f:render partial="Kumano/Card" arguments="{card: card, data: data}"/>
                            </f:for>
                        </kk:grid>
                    </f:else>
                </f:if>
            </f:variable>
            <f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 1, bleed: 0, body: body}"/>
        </f:else>
    </f:if>
</f:section>
</html>
