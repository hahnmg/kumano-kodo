<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:layout name="Content/Default"/>
<f:section name="Main">
    <kk:chapter
        id="{f:if(condition: data.tx_themekumanokodo_anchor, then: data.tx_themekumanokodo_anchor, else: 'c{data.uid}')}"
        number="{number}"
        date="{record -> f:render.text(field: 'subheader')}"
        title="{record -> f:render.text(field: 'header')}"
        images="{record.image}"
    >{record -> f:render.text(field: 'bodytext')}</kk:chapter>
</f:section>
</html>
