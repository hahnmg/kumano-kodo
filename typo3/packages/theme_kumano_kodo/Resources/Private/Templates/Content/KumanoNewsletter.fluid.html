<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:layout name="Content/Default"/>
<f:section name="Main">
    <f:render partial="Kumano/Css" arguments="{names: 'newsletter-form'}"/>
    <f:variable name="body">
        <kk:split ratio="text-media">
            <f:fragment name="first">
                <f:if condition="{record.header}">
                    <f:then>
                        <kk:stack gap="16">
                            <kk:sectionHeading title="{record -> f:render.text(field: 'header')}"/>
                            <kk:richText>
                                {record -> f:render.text(field: 'bodytext')}
                            </kk:richText>
                        </kk:stack>
                    </f:then>
                    <f:else>
                        <kk:richText>
                            {record -> f:render.text(field: 'bodytext')}
                        </kk:richText>
                    </f:else>
                </f:if>
            </f:fragment>
            <f:fragment name="second">
                <f:render partial="Kumano/NewsletterForm" arguments="{
                    action: '{f:if(condition: settings.newsletterTarget, then: \'{f:uri.page(pageUid: settings.newsletterTarget)}\', else: \'#\')}',
                    emailLabel: '{f:translate(key: \'emailAddress\', domain: \'theme_kumano_kodo.messages\')}',
                    placeholder: '{f:translate(key: \'emailPlaceholder\', domain: \'theme_kumano_kodo.messages\')}',
                    consent: '{f:translate(key: \'consent\', domain: \'theme_kumano_kodo.messages\')}',
                    submit: '{f:translate(key: \'subscribe\', domain: \'theme_kumano_kodo.messages\')}'
                }"/>
            </f:fragment>
        </kk:split>
    </f:variable>
    <f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 0, bleed: 0, body: body}"/>
</f:section>
</html>
