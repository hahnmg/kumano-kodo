<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:layout name="Content/Default"/>
<f:section name="Main">
    <f:variable name="text">{record -> f:render.text(field: 'bodytext')}</f:variable>
    <f:switch expression="{data.tx_themekumanokodo_variant}">
        <f:case value="quote">
            <f:variable name="body">
                <kk:quote source="{record -> f:render.text(field: 'header')}">{text -> f:format.raw()}</kk:quote>
            </f:variable>
        </f:case>
        <f:case value="infobox">
            <f:variable name="body">
                <kk:infoBox title="{record -> f:render.text(field: 'header')}">
                    <f:fragment>{text -> f:format.raw()}</f:fragment>
                    <f:fragment name="links">
                        <f:for each="{record.tx_themekumanokodo_links}" as="entry">
                            <kk:infoBoxLink label="{entry -> f:render.text(field: 'title')}" href="{f:uri.typolink(parameter: entry.link)}"/>
                        </f:for>
                    </f:fragment>
                </kk:infoBox>
            </f:variable>
        </f:case>
        <f:case value="notice">
            <f:variable name="body">
                <kk:notice title="{record -> f:render.text(field: 'header')}">{text -> f:format.raw()}</kk:notice>
            </f:variable>
        </f:case>
        <f:defaultCase>
            <f:variable name="body">
                <kk:highlight title="{record -> f:render.text(field: 'header')}" eyebrow="{record -> f:render.text(field: 'subheader')}">{text -> f:format.raw()}</kk:highlight>
            </f:variable>
        </f:defaultCase>
    </f:switch>
    <f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 0, bleed: 0, body: body}"/>
</f:section>
</html>
