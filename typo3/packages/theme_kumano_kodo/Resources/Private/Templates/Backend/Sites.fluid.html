<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module"/>
<f:section name="Content">
    <h1>
        <f:translate key="title" domain="theme_kumano_kodo.module"/>
    </h1>
    <p>
        <f:translate key="description" domain="theme_kumano_kodo.module"/>
    </p>
    <div class="row">
        <f:for each="{kinds}" as="kind">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title">
                            <f:translate key="{kind.kind}.title" domain="theme_kumano_kodo.module"/>
                        </h2>
                        <p>
                            <f:translate key="{kind.kind}.text" domain="theme_kumano_kodo.module"/>
                        </p>
                        <f:if condition="{kind.missing}">
                            <f:then>
                                <p class="text-danger">
                                    <f:translate key="missing" domain="theme_kumano_kodo.module"/>
                                    {kind.missing}
                                </p>
                            </f:then>
                            <f:else>
                                <form method="post" action="{f:be.uri(route: 'kumano_kodo_sites.create')}">
                                    <input type="hidden" name="kind" value="{kind.kind}"/>
                                    <div class="form-group mb-3">
                                        <label class="form-label" for="identifier-{kind.kind}">
                                            <f:translate key="identifier" domain="theme_kumano_kodo.module"/>
                                        </label>
                                        <input class="form-control" id="identifier-{kind.kind}" name="identifier" value="{kind.identifier}"/>
                                    </div>
                                    <div class="form-group mb-3">
                                        <label class="form-label" for="base-{kind.kind}">
                                            <f:translate key="base" domain="theme_kumano_kodo.module"/>
                                        </label>
                                        <input class="form-control" id="base-{kind.kind}" name="base" value="{kind.base}"/>
                                    </div>
                                    <button type="submit" class="btn btn-primary">
                                        <f:translate key="create" domain="theme_kumano_kodo.module"/>
                                    </button>
                                </form>
                            </f:else>
                        </f:if>
                    </div>
                </div>
            </div>
        </f:for>
    </div>
</f:section>
</html>
