<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module"/>
<f:section name="Content">
    <h1>
        <f:translate key="title" domain="theme_kumano_kodo.module"/>
    </h1>
    <p>
        <f:translate key="description" domain="theme_kumano_kodo.module"/>
    </p>
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title">
                        <f:translate key="starter.title" domain="theme_kumano_kodo.module"/>
                    </h2>
                    <p>
                        <f:translate key="starter.text" domain="theme_kumano_kodo.module"/>
                    </p>
                    <f:if condition="{missing}">
                        <f:then>
                            <p class="text-danger">
                                <f:translate key="error.missing" domain="theme_kumano_kodo.module" arguments="{0: missing}"/>
                            </p>
                        </f:then>
                        <f:else>
                            <form method="post" action="{f:be.uri(route: 'kumano_kodo_sites.create')}">
                                <div class="form-group mb-3">
                                    <label class="form-label" for="identifier">
                                        <f:translate key="identifier" domain="theme_kumano_kodo.module"/>
                                    </label>
                                    <input class="form-control" id="identifier" name="identifier" value="{values.identifier}" required="required" pattern="[a-z0-9_\-]+"/>
                                </div>
                                <div class="form-group mb-3">
                                    <label class="form-label" for="base">
                                        <f:translate key="base" domain="theme_kumano_kodo.module"/>
                                    </label>
                                    <input class="form-control" id="base" name="base" value="{values.base}" required="required"/>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <f:translate key="create" domain="theme_kumano_kodo.module"/>
                                </button>
                            </form>
                        </f:else>
                    </f:if>
                </div>
            </div>
        </div>
    </div>
</f:section>
</html>
