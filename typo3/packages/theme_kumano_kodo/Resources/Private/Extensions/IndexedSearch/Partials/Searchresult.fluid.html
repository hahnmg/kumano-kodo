<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/TYPO3/CMS/ThemeKumanoKodo/Components" data-namespace-typo3-fluid="true">
<f:comment>One row: title, the page's path in the tree, the passage with the matched words marked.</f:comment>
<f:variable name="path"><f:for each="{row.pathTitle -> f:split(separator: '/')}" as="step" iteration="i"><f:if condition="{step} && !{i.isLast}"><f:if condition="!{i.isFirst} && {i.index} > 1"> › </f:if>{step}</f:if></f:for></f:variable>
<li>
    <a class="media-list-row search-results-row" href="{row.pathUri}">
        <span class="media-list-text search-results-text">
            <span class="type-h4">{row.item_title}</span>
            <span class="media-list-meta type-caption">{path -> f:format.trim()}</span>
            <span class="search-results-excerpt type-small">{row.description -> f:replace(search: '<strong class="tx-indexedsearch-redMarkup">', replace: '<mark>') -> f:replace(search: '</strong>', replace: '</mark>') -> f:format.raw()}</span>
        </span>
        <span class="icon-circle">
            <kk:icon name="arrow-right" size="24"/>
        </span>
    </a>
</li>
</html>
