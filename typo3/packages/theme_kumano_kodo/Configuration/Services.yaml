services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  TYPO3\CMS\ThemeKumanoKodo\:
    resource: '../Classes/*'
    # These need EXT:form; Services.php registers them only where it is installed.
    exclude: '../Classes/Demo/{WalkForm.php,BuildCommand.php}'

  TYPO3\CMS\ThemeKumanoKodo\DataProcessing\ThemeProcessor:
    tags:
      - name: data.processor
        identifier: kumano-theme

  TYPO3\CMS\ThemeKumanoKodo\DataProcessing\StructuredDataProcessor:
    tags:
      - name: data.processor
        identifier: kumano-structured-data

  TYPO3\CMS\ThemeKumanoKodo\DataProcessing\ChapterNumberProcessor:
    tags:
      - name: data.processor
        identifier: kumano-chapter-number
