<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Theme/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Theme/Components" data-namespace-typo3-fluid="true">
<f:comment>A figure with its label: large on the page ground, on-image over a photo.</f:comment>
<f:argument name="value" type="string|int" description="The figure."/>
<f:argument name="label" type="string" description="What it counts."/>
<f:argument name="variant" type="string" optional="{true}" default="large" description="large or on-image."/>

<f:asset.css identifier="kumano-stat" href="EXT:kumano_kodo/Resources/Public/Css/Components/stat.css"/>
<f:if condition="{variant} == 'on-image'">
    <f:then>
        <div class="stat stat-on-image">
            <p class="stat-label type-label">{label}</p>
            <p class="stat-value type-h3-regular">{value}</p>
        </div>
    </f:then>
    <f:else>
        <div class="stat stat-large">
            <p class="stat-value type-stat">{value}</p>
            <p class="stat-label type-caption">{label}</p>
        </div>
    </f:else>
</f:if>
</html>
