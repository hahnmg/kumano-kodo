<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true"><f:comment>A filter link; the active one marks the current page.</f:comment><f:argument name="label" type="string" description="The text."/><f:argument name="href" type="string" description="The target."/><f:argument name="active" type="bool|int" optional="{true}" default="{false}" description="Marks the current filter."/><f:if condition="{active}"><f:then><a class="chip type-button" href="{href}" aria-current="page">{label}</a></f:then><f:else><a class="chip type-button" href="{href}">{label}</a></f:else></f:if></html>
