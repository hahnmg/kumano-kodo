<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Sitepackage/Components" data-namespace-typo3-fluid="true">
<f:comment>A link in a subNav; the current page is marked.</f:comment>
<f:argument name="label" type="string" description="The text."/>
<f:argument name="href" type="string" description="The target."/>
<f:argument name="current" type="bool|int" optional="{true}" default="{false}" description="Marks the page shown."/>

<li>
    <f:if condition="{current}">
        <f:then><a class="sub-nav-link type-small" href="{href}" aria-current="page">{label}</a></f:then>
        <f:else><a class="sub-nav-link type-small" href="{href}">{label}</a></f:else>
    </f:if>
</li>
</html>
