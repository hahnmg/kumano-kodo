<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Theme/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Theme/Components" data-namespace-typo3-fluid="true">
<f:comment>A person with a round photo, role and focus.</f:comment>
<f:argument name="name" type="string" description="The name."/>
<f:argument name="role" type="string" optional="{true}" description="What the person does."/>
<f:argument name="focus" type="string" optional="{true}" description="A line about the person."/>
<f:argument name="image" type="object" optional="{true}" description="A file or file reference, shown round."/>

<f:asset.css identifier="kumano-person-card" href="EXT:kumano_kodo/Resources/Public/Css/Components/person-card.css"/>
<article class="person-card">
    <f:if condition="{image}">
        <kk:image image="{image}" class="avatar avatar-large" sizes="136px" width="136" height="136"/>
    </f:if>
    <h3 class="person-card-name type-h4">{name}</h3>
    <p class="person-card-role type-small">{role}</p>
    <f:if condition="{focus}">
        <p class="person-card-focus type-small">{focus}</p>
    </f:if>
</article>
</html>
