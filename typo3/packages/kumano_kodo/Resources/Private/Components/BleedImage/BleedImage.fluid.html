<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Theme/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Theme/Components" data-namespace-typo3-fluid="true">
<f:comment>One image across the full width; an optional caption in the slot.</f:comment>
<f:argument name="image" type="mixed" description="A file or file reference; a video as k:media gives it plays in place."/>

<f:asset.css identifier="kumano-bleed-image" href="EXT:kumano_kodo/Resources/Public/Css/Components/bleed-image.css"/>
<f:variable name="caption" value="{f:slot()}"/>
<kk:lightboxGroup tag="figure" class="bleed-image">
    <f:if condition="{image.video}">
        <f:then>
            <kk:video video="{image.video}" poster="{image.poster}" width="{image.width}" height="{image.height}" sizes="100vw"/>
        </f:then>
        <f:else>
            <a class="lightbox-link" href="{image.publicUrl}" data-lightbox aria-haspopup="dialog">
                <kk:image image="{image}" class="bleed-image-image" sizes="100vw"/>
            </a>
        </f:else>
    </f:if>
    <f:if condition="{caption -> f:format.trim()}">
        <figcaption class="bleed-image-caption type-caption">{caption -> f:format.raw()}</figcaption>
    </f:if>
</kk:lightboxGroup>
</html>
