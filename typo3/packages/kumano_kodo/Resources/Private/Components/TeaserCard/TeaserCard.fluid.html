<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Sitepackage/Components" data-namespace-typo3-fluid="true">
<f:comment>A card that links to a page: image, title, subtitle and a meta line with an optional badge.</f:comment>
<f:argument name="title" type="string" description="The title, also the link text."/>
<f:argument name="href" type="string" description="The target."/>
<f:argument name="image" type="object" optional="{true}" description="A file or file reference."/>
<f:argument name="subtitle" type="string" optional="{true}" description="A line below the title."/>
<f:argument name="meta" type="string" optional="{true}" description="A small line at the foot, such as a date."/>
<f:argument name="badge" type="string" optional="{true}" description="A short label beside the meta line."/>
<f:argument name="level" type="string|int" optional="{true}" default="3" description="Heading level: 2, 3 or none."/>

<article class="teaser-card">
    <div class="teaser-card-media">
        <f:if condition="{image}">
            <kk:image image="{image}" class="teaser-card-image" sizes="(width <= 600px) 100vw, (width <= 900px) 50vw, 320px"/>
        </f:if>
    </div>
    <div class="teaser-card-body">
        <f:switch expression="{level}">
            <f:case value="none">
                <p class="teaser-card-title type-h4">
                    <a href="{href}">{title}</a>
                </p>
            </f:case>
            <f:case value="2">
                <h2 class="teaser-card-title type-h4">
                    <a href="{href}">{title}</a>
                </h2>
            </f:case>
            <f:defaultCase>
                <h3 class="teaser-card-title type-h4">
                    <a href="{href}">{title}</a>
                </h3>
            </f:defaultCase>
        </f:switch>
        <f:if condition="{subtitle}">
            <p class="teaser-card-subtitle type-small">{subtitle}</p>
        </f:if>
        <f:if condition="{meta} || {badge}">
            <div class="teaser-card-meta">
                <f:if condition="{meta}">
                    <p class="type-caption">{meta}</p>
                </f:if>
                <f:if condition="{badge}">
                    <kk:badge label="{badge}"/>
                </f:if>
            </div>
        </f:if>
    </div>
</article>
</html>
