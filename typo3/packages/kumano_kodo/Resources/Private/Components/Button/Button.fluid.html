<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true"><f:comment>The call to action of a section: a link with href, a button without.</f:comment><f:argument name="label" type="string" description="The text."/><f:argument name="href" type="string" optional="{true}" description="Turns the button into a link."/><f:argument name="variant" type="string" optional="{true}" default="primary" description="primary or secondary on the page ground, light or outline on photos."/><f:argument name="type" type="string" optional="{true}" default="button" description="button or submit, without href."/><f:if condition="{href}"><f:then><a class="button type-button button-{variant}" href="{href}">{label}</a></f:then><f:else><button class="button type-button button-{variant}" type="{type}">{label}</button></f:else></f:if></html>
