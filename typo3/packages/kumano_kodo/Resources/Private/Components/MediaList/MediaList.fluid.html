<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Sitepackage/Components" data-namespace-typo3-fluid="true">
<f:comment>Rows with a small round image, a title and a meta line; the rows are mediaListItem components, a link to more in the fragment more.</f:comment>
<f:argument name="title" type="string" description="The heading of the list."/>

<f:asset.css identifier="kumano-media-list" href="EXT:kumano_kodo/Resources/Public/Css/Components/media-list.css"/>
<f:variable name="more" value="{f:slot(name: 'more')}"/>
<section class="media-list">
    <h2 class="media-list-title type-label">{title}</h2>
    <ul class="media-list-items">
        <f:slot/>
    </ul>
    <f:if condition="{more -> f:format.trim()}">
        <p class="media-list-more">{more -> f:format.raw()}</p>
    </f:if>
</section>
</html>
