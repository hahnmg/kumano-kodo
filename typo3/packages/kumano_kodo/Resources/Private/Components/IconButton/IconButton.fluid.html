<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>A round arrow button, as the slider uses.</f:comment>
<f:comment>Generated by scripts/build-typo3.mjs from the Storybook markup; edit it there.</f:comment>
<f:argument name="direction" type="string" description="previous or next."/>
<f:argument name="label" type="string" description="Accessible name."/>

<f:if condition="{direction} == 'previous'">
    <f:then>
        <button class="icon-button" type="button" aria-label="{label}" data-direction="previous"><svg width="20" height="12" viewBox="0 0 20 12" fill="none" aria-hidden="true"><path d="M19 6H1m0 0 5-5M1 6l5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    </f:then>
    <f:else>
        <button class="icon-button" type="button" aria-label="{label}" data-direction="next"><svg width="20" height="12" viewBox="0 0 20 12" fill="none" aria-hidden="true"><path d="M1 6h18m0 0-5-5m5 5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    </f:else>
</f:if>
</html>
