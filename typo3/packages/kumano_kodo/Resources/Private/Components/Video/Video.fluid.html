<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Theme/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Theme/Components" data-namespace-typo3-fluid="true">
<f:comment>
    A video in an image's place: the poster in the video's format and a play button. The player (MP4, WebM, YouTube,
    Vimeo) waits in a template, whose content the browser does not fetch, until the button is pressed; YouTube and
    Vimeo ask first.
</f:comment>
<f:argument name="video" type="object" description="The video file or reference."/>
<f:argument name="poster" type="object" optional="{true}" description="An image file or reference shown until play."/>
<f:argument name="width" type="string|int" optional="{true}" default="16" description="The video's width, for its format."/>
<f:argument name="height" type="string|int" optional="{true}" default="9" description="The video's height, for its format."/>
<f:argument name="class" type="string" optional="{true}" description="A class for the box, where an element's layout hangs on it."/>
<f:argument name="sizes" type="string" optional="{true}" default="(width <= 900px) 100vw, 50vw" description="As for image."/>

<f:asset.script identifier="kumano-video" src="EXT:kumano_kodo/Resources/Public/JavaScript/video.js" type="module"/>
<div class="video{f:if(condition: class, then: ' {class}')}" style="aspect-ratio: {width} / {height}">
    <f:if condition="{poster}">
        <kk:image image="{poster}" class="video-poster" sizes="{sizes}"/>
    </f:if>
    <button class="video-play" type="button" aria-label="{f:translate(key: 'playVideo', domain: 'kumano_kodo.messages')}">
        <kk:icon name="play" size="28"/>
    </button>
    <template class="video-source">
        <f:media file="{video}" width="{width}" height="{height}" class="video-player"/>
    </template>
    <kk:videoConsent video="{video}"/>
</div>
</html>
