<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Sitepackage/Components" data-namespace-typo3-fluid="true">
<f:comment>Files to download, each with type and size read from the file.</f:comment>
<f:argument name="files" type="iterable" description="Files or file references; a reference title wins over the file name."/>

<f:asset.css identifier="kumano-download-list" href="EXT:kumano_kodo/Resources/Public/Css/Components/download-list.css"/>
<ul class="download-list">
    <f:for each="{files}" as="file">
        <li>
            <a class="download-list-row" href="{file.publicUrl}" download>
                <kk:icon name="file" size="24"/>
                <span class="download-list-text"><span class="type-button">{f:if(condition: file.title, then: file.title, else: file.name)}</span><span class="download-list-meta type-caption">{file.extension -> f:format.case(mode: 'upper')} · {file.size -> f:format.bytes(units: 'B,KB,MB,GB')}</span></span>
                <kk:icon name="download" size="24"/>
            </a>
        </li>
    </f:for>
</ul>
</html>
