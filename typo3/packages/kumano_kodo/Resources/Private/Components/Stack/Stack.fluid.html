<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Theme/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Theme/Components" data-namespace-typo3-fluid="true">
<f:comment>Children one below the other at a set gap.</f:comment>
<f:argument name="gap" type="string|int" optional="{true}" default="column" description="heading (heading to content), elements (between the elements of a section), column (in a column), or a spacing step such as 16 or 24."/>

<f:variable name="token">
    <f:switch expression="{gap}">
        <f:case value="heading">--section-heading-gap</f:case>
        <f:case value="elements">--section-element-gap</f:case>
        <f:case value="column">--column-element-gap</f:case>
        <f:defaultCase>--space-{gap}</f:defaultCase>
    </f:switch>
</f:variable>
<div class="stack" style="--stack-gap: var({token -> f:format.trim()})">
    <f:slot/>
</div>
</html>
