<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Sitepackage/Components" data-namespace-typo3-fluid="true">
<f:comment>An image beside a heading, the text in the slot and an optional link.</f:comment>
<f:argument name="title" type="string" description="The heading."/>
<f:argument name="image" type="object" optional="{true}" description="A file or file reference."/>
<f:argument name="imageSide" type="string" optional="{true}" default="left" description="left or right."/>
<f:argument name="linkLabel" type="string" optional="{true}" description="The link text."/>
<f:argument name="href" type="string" optional="{true}" description="The link target."/>

<f:asset.css identifier="kumano-text-media" href="EXT:kumano_kodo/Resources/Public/Css/Components/text-media.css"/>
<div class="text-media text-media-image-{imageSide}">
    <f:if condition="{image}">
        <kk:image image="{image}" class="text-media-image"/>
    </f:if>
    <div class="text-media-text">
        <h2 class="type-h3">{title}</h2>
        <p class="text-media-body type-body"><f:slot/></p>
        <f:if condition="{href}">
            <p><kk:link label="{linkLabel}" href="{href}"/></p>
        </f:if>
    </div>
</div>
</html>
