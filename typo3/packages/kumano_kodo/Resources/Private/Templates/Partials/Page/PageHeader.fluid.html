<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true"><div class="page-header"><div class="page-header__inner"><nav class="breadcrumb" aria-label="{f:translate(key: 'breadcrumb', domain: 'kumano_kodo.messages')}"><ol class="breadcrumb__list type-small"><f:for each="{breadcrumb}" as="crumb" iteration="i"><f:if condition="{i.isLast}"><f:then><li class="breadcrumb__item breadcrumb__item--current" aria-current="page">{crumb.title}</li></f:then><f:else><li class="breadcrumb__item"><a href="{crumb.link}">{crumb.title}</a></li></f:else></f:if></f:for></ol></nav><h1 class="page-header__title type-h2">{page.pageRecord.title}</h1></div></div></html>
