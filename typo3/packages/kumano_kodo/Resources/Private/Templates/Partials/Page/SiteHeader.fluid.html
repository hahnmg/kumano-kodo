<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Sitepackage/Components" data-namespace-typo3-fluid="true">
<header class="site-header">
    <f:if condition="{theme.logo}">
        <f:then>
            <a class="logo" href="{f:uri.page(pageUid: site.rootPageId)}" aria-label="{theme.name}">{theme.logo -> f:format.raw()}</a>
        </f:then>
        <f:else if="{settings.kumanoKodo.brand.logo} == 'kumano'">
            <f:render partial="Kumano/Logo" arguments="{href: '{f:uri.page(pageUid: site.rootPageId)}', label: theme.name}"/>
        </f:else>
        <f:else>
            <a class="logo logo-title type-logo" href="{f:uri.page(pageUid: site.rootPageId)}">{theme.name}</a>
        </f:else>
    </f:if>
    <f:render partial="Kumano/MenuButton" arguments="{label: '{f:translate(key: \'menu\', domain: \'kumano_kodo.messages\')}'}"/>
    <div class="site-header-panel">
        <f:if condition="{theme.searchPage}">
            <f:render partial="Kumano/Css" arguments="{names: 'search-form'}"/>
            <f:variable name="searchLabel">{f:translate(key: 'search', domain: 'kumano_kodo.messages')}</f:variable>
            <div class="site-header-item site-header-item-search">
                <button class="site-header-toggle site-header-search-toggle" type="button" aria-expanded="false" aria-label="{searchLabel}">
                    <kk:icon name="search" size="16"/>
                </button>
                <div class="nav-flyout nav-flyout-search">
                    <f:render partial="Kumano/SearchForm" arguments="{action: '{f:uri.page(pageUid: theme.searchPage)}', label: searchLabel, submit: searchLabel, placeholder: '{f:translate(key: \'searchPlaceholder\', domain: \'kumano_kodo.messages\')}'}"/>
                </div>
            </div>
        </f:if>
        <nav class="site-header-nav" aria-label="{f:translate(key: 'mainNav', domain: 'kumano_kodo.messages')}">
            <ul class="site-header-list">
                <f:for each="{mainNavigation}" as="item">
                    <f:render partial="Page/NavItem" arguments="{item: item}"/>
                </f:for>
            </ul>
        </nav>
        <div class="site-header-tools">
            <f:if condition="{languageNavigation -> f:count()} > 1">
                <ul class="site-header-languages" aria-label="{f:translate(key: 'language', domain: 'kumano_kodo.messages')}">
                    <f:for each="{languageNavigation}" as="lang">
                        <f:if condition="{lang.available}">
                            <li>
                                <f:if condition="{lang.active}">
                                    <f:then>
                                        <a class="type-label" href="{lang.link}" lang="{lang.hreflang}" hreflang="{lang.hreflang}" data-locale="{lang.hreflang}" aria-current="true">{lang.navigationTitle}</a>
                                    </f:then>
                                    <f:else>
                                        <a class="type-label" href="{lang.link}" lang="{lang.hreflang}" hreflang="{lang.hreflang}" data-locale="{lang.hreflang}">{lang.navigationTitle}</a>
                                    </f:else>
                                </f:if>
                            </li>
                        </f:if>
                    </f:for>
                </ul>
            </f:if>
            <f:if condition="{settings.kumanoKodo.schemeToggle}">
                <f:render partial="Kumano/SchemeToggle" arguments="{label: '{f:translate(key: \'darkMode\', domain: \'kumano_kodo.messages\')}'}"/>
            </f:if>
        </div>
    </div>
</header>
</html>
