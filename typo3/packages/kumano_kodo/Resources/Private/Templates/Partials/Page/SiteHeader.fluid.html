<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true"><header class="site-header"><f:if condition="{theme.logo}"><f:then><a class="logo" href="{f:uri.page(pageUid: site.rootPageId)}" aria-label="{theme.name}">{theme.logo -> f:format.raw()}</a></f:then><f:else><f:render partial="Kumano/Logo" arguments="{href: '{f:uri.page(pageUid: site.rootPageId)}', label: theme.name}"/></f:else></f:if><f:render partial="Kumano/MenuButton" arguments="{label: '{f:translate(key: \'menu\', domain: \'kumano_kodo.messages\')}'}"/><div class="site-header__panel"><nav class="site-header__nav" aria-label="{f:translate(key: 'mainNav', domain: 'kumano_kodo.messages')}"><ul class="site-header__list"><f:for each="{mainNavigation}" as="item"><f:render partial="Page/NavItem" arguments="{item: item}"/></f:for></ul></nav><div class="site-header__tools"><f:if condition="{languageNavigation -> f:count()} > 1"><ul class="site-header__languages" aria-label="{f:translate(key: 'language', domain: 'kumano_kodo.messages')}"><f:for each="{languageNavigation}" as="lang"><f:if condition="{lang.available}"><li><f:if condition="{lang.active}"><f:then><a class="type-label" href="{lang.link}" lang="{lang.hreflang}" hreflang="{lang.hreflang}" data-locale="{lang.hreflang}" aria-current="true">{lang.navigationTitle}</a></f:then><f:else><a class="type-label" href="{lang.link}" lang="{lang.hreflang}" hreflang="{lang.hreflang}" data-locale="{lang.hreflang}">{lang.navigationTitle}</a></f:else></f:if></li></f:if></f:for></ul></f:if><f:if condition="{settings.kumanoKodo.schemeToggle}"><f:render partial="Kumano/SchemeToggle" arguments="{label: '{f:translate(key: \'darkMode\', domain: \'kumano_kodo.messages\')}'}"/></f:if></div></div></header></html>
