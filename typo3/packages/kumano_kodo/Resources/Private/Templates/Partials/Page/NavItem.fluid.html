<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true"><f:variable name="flyout" value="{item.data.tx_kumanokodo_flyout}"/><f:if condition="{flyout}"><f:then><li class="site-header__item site-header__item--{flyout}"><f:if condition="{item.active}"><f:then><button class="site-header__link site-header__toggle type-small" type="button" aria-expanded="false" aria-current="true"></f:then><f:else><button class="site-header__link site-header__toggle type-small" type="button" aria-expanded="false"></f:else></f:if>{item.title}<f:render partial="Kumano/Icon" arguments="{name: 'chevron-down', size: 14}"/></button><f:render partial="Page/NavFlyout" arguments="{item: item, flyout: flyout}"/></li></f:then><f:else><li class="site-header__item"><f:link.typolink parameter="{item.link}" class="site-header__link type-small" additionalAttributes="{f:if(condition: item.active, then: {aria-current: 'page'})}">{item.title}</f:link.typolink></li></f:else></f:if></html>
