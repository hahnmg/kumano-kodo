<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true"><f:comment>Mirrors img() in src/lib/html.ts: 1200px as src, 640/1200/2400 in srcset.</f:comment><f:variable name="width" value="{image.properties.width}"/><f:variable name="height" value="{image.properties.height}"/><f:variable name="scaled" value="{height * 1200 / width}"/><img class="{class}" src="{f:uri.image(image: image, maxWidth: 1200)}" srcset="{f:uri.image(image: image, maxWidth: 640)} 640w, {f:uri.image(image: image, maxWidth: 1200)} 1200w, {f:uri.image(image: image, maxWidth: 2400)} 2400w" sizes="{sizes}" alt="{image.alternative}" width="1200" height="{scaled -> f:round()}" loading="{f:if(condition: eager, then: 'eager', else: 'lazy')}" decoding="async"></html>
