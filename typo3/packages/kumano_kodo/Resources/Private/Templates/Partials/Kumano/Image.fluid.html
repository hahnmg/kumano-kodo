<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:comment>Mirrors img() in src/lib/html.ts: 1200px as src, 640/1200/2400 in srcset; avatars pass their own size.</f:comment><f:variable name="scaled" value="{image.properties.height * 1200 / image.properties.width}"/><img class="{class}" src="{f:uri.image(image: image, maxWidth: 1200)}" srcset="{f:uri.image(image: image, maxWidth: 640)} 640w, {f:uri.image(image: image, maxWidth: 1200)} 1200w, {f:uri.image(image: image, maxWidth: 2400)} 2400w" sizes="{sizes -> f:or(alternative: '(width <= 900px) 100vw, 50vw')}" alt="{image.alternative}" width="{width -> f:or(alternative: 1200)}" height="{height -> f:or(alternative: '{scaled -> f:round()}')}" loading="{f:if(condition: eager, then: 'eager', else: 'lazy')}" decoding="async"></html>
