<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:if condition="{heading} && {record.header}"><f:then><f:variable name="inner"><div class="stack" style="--stack-gap: var(--space-{record.tx_kumanokodo_gap})"><f:render partial="Kumano/SectionHeading" arguments="{title: record.header, eyebrow: record.subheader, aside: record.tx_kumanokodo_aside}"/>{body -> f:format.raw()}</div></f:variable></f:then><f:else><f:variable name="inner">{body -> f:format.raw()}</f:variable></f:else></f:if><f:if condition="{child}"><f:then>{inner -> f:format.raw()}</f:then><f:else><f:variable name="class">section section--{record.tx_kumanokodo_tone} section--space-{record.tx_kumanokodo_space}<f:if condition="{record.tx_kumanokodo_bleed}"> section--bleed</f:if></f:variable><k:element tag="section" attributes="{class: class, aria-label: record.tx_kumanokodo_label, id: record.tx_kumanokodo_anchor}"><div class="section__inner">{inner -> f:format.raw()}</div></k:element></f:else></f:if></html>
