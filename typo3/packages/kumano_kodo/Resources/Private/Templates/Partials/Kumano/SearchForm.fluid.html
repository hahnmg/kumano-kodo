<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>The Search Form molecule, posting to the indexed_search plugin on the search page.</f:comment>
<form class="search-form" role="search" aria-label="{f:if(condition: landmark, then: landmark, else: label)}" action="{action}" method="post"><input type="hidden" name="tx_indexedsearch_pi2[action]" value="search"><input type="hidden" name="tx_indexedsearch_pi2[controller]" value="Search"><label class="field"><span class="field__label type-label">{label}</span><span class="field__box"><f:render partial="Kumano/Icon" arguments="{name: 'search', size: 18}"/><input class="field__control type-small" type="search" name="tx_indexedsearch_pi2[search][sword]" placeholder="{placeholder}" value="{value}"></span></label><f:render partial="Kumano/Button" arguments="{label: submit, type: 'submit', variant: 'primary'}"/></form>
</html>
