<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Sitepackage/Components" data-namespace-typo3-fluid="true">
<f:comment>The Search Form molecule, posting to the indexed_search plugin on the search page.</f:comment>
<form class="search-form" role="search" aria-label="{f:if(condition: landmark, then: landmark, else: label)}" action="{action}" method="post">
    <input type="hidden" name="tx_indexedsearch_pi2[action]" value="search">
    <input type="hidden" name="tx_indexedsearch_pi2[controller]" value="Search">
    <label class="field">
        <span class="field-label type-label">{label}</span>
        <span class="field-box">
            <kk:icon name="search" size="18"/>
            <input class="field-control type-small" type="search" name="tx_indexedsearch_pi2[search][sword]" placeholder="{placeholder}" value="{value}">
        </span>
    </label>
    <kk:button label="{submit}" type="submit" variant="primary"/>
</form>
</html>
