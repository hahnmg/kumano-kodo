<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:page.meta property="viewport">width=device-width, initial-scale=1</f:page.meta>
<f:asset.css identifier="kumano-global" href="EXT:kumano_kodo/Resources/Public/Css/global.css"/>
<f:for each="{theme.fonts}" as="font" iteration="i">
    <f:asset.css identifier="kumano-font-{i.index}" href="{font}"/>
</f:for>
<f:if condition="{theme.css}">
    <f:asset.css identifier="kumano-theme" inline="1">{theme.css -> f:format.raw()}</f:asset.css>
</f:if>
<f:asset.script identifier="kumano-site" src="EXT:kumano_kodo/Resources/Public/JavaScript/site.js" type="module"/>
<f:if condition="{theme.ownCss}">
    <f:asset.css identifier="kumano-own" href="{theme.ownCss}"/>
</f:if>
<f:if condition="{theme.ownJs}">
    <f:asset.script identifier="kumano-own" src="{theme.ownJs}" type="module"/>
</f:if>
<a class="skip-link type-button" href="#main">{f:translate(key: 'skipToContent', domain: 'kumano_kodo.messages')}</a>
<f:render section="Topbar" optional="true">
    <f:if condition="{content.topbar.records}">
        <f:render partial="Page/Topbar" arguments="{_all}"/>
    </f:if>
</f:render>
<f:render partial="Page/SiteHeader" arguments="{_all}"/>
<f:render section="Main"/>
<f:render section="Footer" optional="true">
    <f:render partial="Page/SiteFooter" arguments="{_all}"/>
</f:render>
<f:if condition="{structuredData}">
    <script type="application/ld+json">{structuredData -> f:format.raw()}</script>
</f:if>
</html>
