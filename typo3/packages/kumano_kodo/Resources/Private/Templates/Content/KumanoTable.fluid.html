<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'table'}"/><f:variable name="body"><div class="table-wrap"><table class="table"><caption class="visually-hidden">{record.header}</caption><f:for each="{table}" as="row" iteration="r"><f:if condition="{r.isFirst}"><thead><tr><f:for each="{row}" as="cell"><th scope="col" class="type-label">{cell}</th></f:for></tr></thead><tbody></f:if><f:if condition="!{r.isFirst}"><tr><f:for each="{row}" as="cell"><td class="type-small">{cell}</td></f:for></tr></f:if></f:for></tbody></table></div></f:variable><f:render partial="Kumano/Section" arguments="{record: record, heading: 0, body: body, child: data.tx_kumanokodo_parent}"/></f:section></html>
