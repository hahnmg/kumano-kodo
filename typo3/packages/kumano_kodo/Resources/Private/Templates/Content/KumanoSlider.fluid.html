<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'slider,stage-card,section-heading'}"/><f:asset.script identifier="kumano-slider" src="EXT:kumano_kodo/Resources/Public/JavaScript/slider.js" type="module"/><f:variable name="body"><div class="slider" data-slider><f:render partial="Kumano/SectionHeading" arguments="{title: record.header, eyebrow: record.subheader, controls: 1}"/><div class="rail slider__track" tabindex="0" role="group" aria-label="{record.header}"><f:for each="{record.tx_kumanokodo_items}" as="stage"><article class="stage-card"><f:for each="{stage.image}" as="image" iteration="i"><f:if condition="{i.isFirst}"><f:render partial="Kumano/Image" arguments="{image: image, class: 'stage-card__image', sizes: '(width <= 600px) 80vw, 420px'}"/></f:if></f:for><div class="stage-card__meta"><p class="stage-card__stage type-label">{stage.label}</p><p class="stage-card__stats type-caption">{stage.meta}</p></div><h3 class="stage-card__title type-h4">{stage.title}</h3><p class="stage-card__description type-small">{stage.text}</p></article></f:for></div><div class="slider__dots"><div class="slider-dots"><f:for each="{record.tx_kumanokodo_items}" as="stage" iteration="i"><f:if condition="{i.isFirst}"><f:then><button class="slider-dots__dot slider-dots__dot--active" type="button" aria-label="{f:translate(key: 'card', domain: 'kumano_kodo.messages')} {i.cycle}" aria-current="true"></button></f:then><f:else><button class="slider-dots__dot" type="button" aria-label="{f:translate(key: 'card', domain: 'kumano_kodo.messages')} {i.cycle}"></button></f:else></f:if></f:for></div></div></div></f:variable><f:render partial="Kumano/Section" arguments="{record: record, heading: 0, body: body, child: data.tx_kumanokodo_parent}"/></f:section></html>
