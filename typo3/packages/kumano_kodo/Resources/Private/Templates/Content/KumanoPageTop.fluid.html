<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Sitepackage/Components" data-namespace-typo3-fluid="true">
<f:layout name="Content/Default"/>
<f:section name="Main">
    <f:variable name="text">{record.bodytext -> f:format.stripTags(allowedTags: '<strong><em><b><i><a><br>') -> f:format.html(parseFuncTSPath: 'lib.parseFunc')}</f:variable>
    <f:switch expression="{data.tx_kumanokodo_variant}">
        <f:case value="opener">
            <kk:pageIntro title="{record.header}" eyebrow="{record.subheader}" meta="{record.tx_kumanokodo_meta}" upright="{settings.upright}">{text -> f:format.raw()}</kk:pageIntro>
        </f:case>
        <f:case value="text">
            <f:variable name="link" value="{record.tx_kumanokodo_links -> f:first()}"/>
            <f:variable name="body">
                <h1 class="type-h2">{record.header}</h1>
                <p class="type-lead">{text -> f:format.raw()}</p>
                <f:if condition="{link}">
                    <div><kk:button label="{link.title}" href="{f:uri.typolink(parameter: link.link)}"/></div>
                </f:if>
            </f:variable>
            <f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 0, bleed: 0, body: body}"/>
        </f:case>
        <f:defaultCase>
            <kk:hero title="{record.header}" eyebrow="{record.subheader}" image="{record.image -> f:first()}" video="{record.tx_kumanokodo_video -> f:first()}">
                <f:fragment>{text -> f:format.raw()}</f:fragment>
                <f:fragment name="actions">
                    <f:for each="{record.tx_kumanokodo_links}" as="action" iteration="i">
                        <kk:button label="{action.title}" href="{f:uri.typolink(parameter: action.link)}" variant="{f:if(condition: i.isFirst, then: 'light', else: 'outline')}"/>
                    </f:for>
                </f:fragment>
                <f:fragment name="stats">
                    <f:for each="{record.tx_kumanokodo_facts}" as="stat">
                        <kk:stat value="{stat.value}" label="{stat.label}" variant="on-image"/>
                    </f:for>
                </f:fragment>
            </kk:hero>
        </f:defaultCase>
    </f:switch>
</f:section>
</html>
