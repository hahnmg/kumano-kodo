<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'journal-opener,hero-split,media-list,hero,stat'}"/><f:switch expression="{data.tx_kumanokodo_variant}"><f:case value="opener"><header class="journal-opener"><div class="journal-opener__inner"><div class="journal-opener__title"><p class="journal-opener__kicker type-label">{record.subheader}</p><h1 class="type-hero">{record.tx_kumanokodo_heading}</h1></div><div class="journal-opener__lede"><p class="type-lead">{record.bodytext}</p><p class="journal-opener__meta type-caption">{record.tx_kumanokodo_meta}</p></div><f:if condition="{record.tx_kumanokodo_vertical}"><p class="journal-opener__vertical" aria-hidden="true">{record.tx_kumanokodo_vertical}</p></f:if></div></header></f:case><f:case value="hero_list"><section class="hero-split"><div class="hero-split__inner"><div class="hero-split__text"><h1 class="type-h2">{record.tx_kumanokodo_heading}</h1><p class="type-lead">{record.bodytext}</p><div><f:render partial="Kumano/Button" arguments="{label: record.tx_kumanokodo_link_label, href: '{f:uri.typolink(parameter: record.tx_kumanokodo_link)}', variant: 'primary'}"/></div></div><div class="hero-split__panel"><f:render partial="Kumano/MediaList" arguments="{title: record.subheader, items: record.tx_kumanokodo_list_items, moreLink: record.tx_kumanokodo_link2, moreLabel: record.tx_kumanokodo_link2_label}"/></div></div></section></f:case><f:defaultCase><section class="hero"><f:for each="{record.image}" as="image" iteration="i"><f:if condition="{i.isFirst}"><f:render partial="Kumano/Image" arguments="{image: image, class: 'hero__image', sizes: '100vw', eager: 1}"/></f:if></f:for><div class="hero__shade"></div><div class="hero__content"><p class="hero__eyebrow type-label">{record.subheader}</p><h1 class="hero__title type-hero">{record.tx_kumanokodo_heading}</h1><div class="hero__teaser"><p class="type-lead">{record.bodytext}</p><div class="hero__actions"><f:for each="{record.tx_kumanokodo_list_items}" as="action" iteration="i"><f:render partial="Kumano/Button" arguments="{label: action.title, href: '{f:uri.typolink(parameter: action.link)}', variant: '{f:if(condition: i.isFirst, then: \'light\', else: \'outline\')}'}"/></f:for></div></div><div class="hero__stats"><f:for each="{record.tx_kumanokodo_facts}" as="stat"><div class="stat stat--on-image"><p class="stat__label type-label">{stat.label}</p><p class="stat__value type-h3-regular">{stat.value}</p></div></f:for></div></div></section></f:defaultCase></f:switch></f:section></html>
