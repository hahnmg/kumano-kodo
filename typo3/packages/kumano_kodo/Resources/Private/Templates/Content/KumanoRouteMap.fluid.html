<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'route-map,section-heading'}"/><f:variable name="body"><f:variable name="label">{record.tx_kumanokodo_meta}</f:variable><figure class="route-map"><div class="route-map__scroll" tabindex="0" role="group" aria-label="{label}"><svg class="route-map__svg" viewBox="0 0 1000 250" role="img" aria-label="{label}"><path class="route-map__path" d="{record.tx_kumanokodo_path}"/><f:for each="{record.tx_kumanokodo_stations}" as="station"><f:if condition="{station.boundary}"><line class="route-map__boundary" x1="{station.x}" y1="{station.y}" x2="{station.x}" y2="228"/></f:if></f:for><f:for each="{record.tx_kumanokodo_stations}" as="station" iteration="i"><f:if condition="{i.isLast}"><f:then><circle class="route-map__station route-map__station--end" cx="{station.x}" cy="{station.y}" r="8"/></f:then><f:else><circle class="route-map__station" cx="{station.x}" cy="{station.y}" r="7"/></f:else></f:if><text class="route-map__label" x="{station.x}" y="{station.label_y}" text-anchor="{station.anchor}">{station.name}</text></f:for></svg><ol class="route-map__days type-caption"><f:for each="{record.tx_kumanokodo_day_marks}" as="day"><li style="left:{day.x / 10}%">{day.label}</li></f:for></ol></div><figcaption class="route-map__legend type-caption"><span><i class="route-map__key route-map__key--walked"></i>{record.tx_kumanokodo_legend_walked}</span><span><i class="route-map__key route-map__key--end"></i>{record.tx_kumanokodo_legend_end}</span><span><i class="route-map__key route-map__key--boundary"></i>{record.tx_kumanokodo_legend_boundary}</span></figcaption></figure></f:variable><f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 1, bleed: 0, body: body}"/></f:section></html>
