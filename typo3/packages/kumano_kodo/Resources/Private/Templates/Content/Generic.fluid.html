<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Content/Default"/>
<f:section name="Main">
    <f:render partial="Kumano/Css" arguments="{names: 'search-form,search-results,pagination,media-list,login-form,form'}"/>
    <f:variable name="body"><f:cObject typoscriptObjectPath="tt_content.{data.CType}.20" data="{data}" table="tt_content"/></f:variable>
    <f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 1, bleed: 0, body: body}"/>
</f:section>
</html>
