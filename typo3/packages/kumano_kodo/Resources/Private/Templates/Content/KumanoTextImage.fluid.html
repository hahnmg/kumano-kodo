<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'text-media'}"/><f:variable name="body"><div class="text-media text-media--image-{data.tx_kumanokodo_variant}"><f:for each="{record.image}" as="image" iteration="i"><f:if condition="{i.isFirst}"><f:render partial="Kumano/Image" arguments="{image: image, class: 'text-media__image'}"/></f:if></f:for><div class="text-media__text"><h2 class="type-h3">{record.header}</h2><p class="text-media__body type-body">{record.bodytext}</p><f:if condition="{data.tx_kumanokodo_link}"><p><f:render partial="Kumano/Link" arguments="{label: record.tx_kumanokodo_link_label, href: '{f:uri.typolink(parameter: record.tx_kumanokodo_link)}'}"/></p></f:if></div></div></f:variable><f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 0, bleed: 0, body: body}"/></f:section></html>
