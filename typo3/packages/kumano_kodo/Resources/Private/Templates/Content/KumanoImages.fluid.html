<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'bleed-photo,gallery,figure,lightbox,section-heading'}"/><f:asset.script identifier="kumano-lightbox" src="EXT:kumano_kodo/Resources/Public/JavaScript/lightbox.js" type="module"/><f:switch expression="{data.tx_kumanokodo_variant}"><f:case value="fullwidth"><f:for each="{record.image}" as="image" iteration="i"><f:if condition="{i.isFirst}"><f:variable name="caption">{f:if(condition: record.bodytext, then: record.bodytext, else: image.description)}</f:variable><f:variable name="body"><a class="lightbox-link" href="{image.publicUrl}" data-lightbox aria-haspopup="dialog"><f:render partial="Kumano/Image" arguments="{image: image, class: 'bleed-photo__image', sizes: '100vw'}"/></a><f:if condition="{caption}"><figcaption class="bleed-photo__caption type-caption">{caption}</figcaption></f:if></f:variable><f:render partial="Kumano/Group" arguments="{tag: 'figure', class: 'bleed-photo', body: body}"/></f:if></f:for></f:case><f:case value="gallery"><f:variable name="body"><f:variable name="images"><div class="gallery__grid"><f:for each="{record.image}" as="image"><f:render partial="Kumano/LightboxLink" arguments="{image: image, class: 'gallery__image'}"/></f:for></div><f:if condition="{record.bodytext}"><figcaption class="gallery__caption type-caption">{record.bodytext}</figcaption></f:if></f:variable><f:render partial="Kumano/Group" arguments="{tag: 'figure', class: 'gallery', body: images}"/></f:variable><f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 1, bleed: 0, body: body}"/></f:case><f:defaultCase><f:variable name="body"><f:variable name="class">figure figure--{f:if(condition: '{record.image -> f:count()} == 2', then: 'pair', else: 'default')}<f:if condition="!{data.tx_kumanokodo_rule}"> figure--unruled</f:if></f:variable><f:variable name="caption"><f:if condition="{record.bodytext}"><f:then>{record.bodytext}</f:then><f:else><f:for each="{record.image}" as="first" iteration="i"><f:if condition="{i.isFirst}">{first.description}</f:if></f:for></f:else></f:if></f:variable><f:variable name="body"><div class="figure__images"><f:for each="{record.image}" as="image"><f:render partial="Kumano/LightboxLink" arguments="{image: image, class: 'figure__image'}"/></f:for></div><figcaption class="figure__caption type-caption">{caption}</figcaption></f:variable><f:render partial="Kumano/Group" arguments="{tag: 'figure', class: class, body: body}"/></f:variable><f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 0, bleed: 0, body: body}"/></f:defaultCase></f:switch></f:section></html>
