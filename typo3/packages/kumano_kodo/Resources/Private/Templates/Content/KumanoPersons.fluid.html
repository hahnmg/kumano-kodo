<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'person-card,section-heading'}"/><f:variable name="body"><div class="grid grid--{record.tx_kumanokodo_columns}"><f:for each="{record.tx_kumanokodo_items}" as="item"><article class="person-card"><f:for each="{item.image}" as="image" iteration="i"><f:if condition="{i.isFirst}"><f:render partial="Kumano/Image" arguments="{image: image, class: 'avatar avatar--large', sizes: '136px', width: 136, height: 136}"/></f:if></f:for><h3 class="person-card__name type-h4">{item.title}</h3><p class="person-card__role type-small">{item.subtitle}</p><f:if condition="{item.text}"><p class="person-card__focus type-small">{item.text}</p></f:if></article></f:for></div></f:variable><f:render partial="Kumano/Section" arguments="{record: record, heading: 1, body: body, child: data.tx_kumanokodo_parent}"/></f:section></html>
