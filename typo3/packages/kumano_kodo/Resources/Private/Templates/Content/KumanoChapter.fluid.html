<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'chapter,lightbox'}"/><f:asset.script identifier="kumano-lightbox" src="EXT:kumano_kodo/Resources/Public/JavaScript/lightbox.js" type="module"/><f:variable name="id">{record.tx_kumanokodo_anchor -> f:or(alternative: 'c{record.uid}')}</f:variable><section class="chapter" aria-labelledby="{id}"><div class="chapter__inner"><div class="chapter__head"><p class="chapter__number type-hero" aria-hidden="true">{record.tx_kumanokodo_number}</p><div class="chapter__text"><p class="chapter__date type-caption">{record.subheader}</p><h2 id="{id}" class="chapter__title type-h3">{record.header}</h2><p class="type-lead">{record.bodytext}</p></div></div><f:variable name="photos"><f:for each="{record.tx_kumanokodo_items}" as="item"><f:for each="{item.image}" as="image" iteration="i"><f:if condition="{i.isFirst}"><f:variable name="orientation">{f:if(condition: '{image.properties.height} > {image.properties.width}', then: 'portrait', else: 'landscape')}</f:variable><figure class="chapter__photo chapter__photo--{orientation} chapter__photo--shift-{item.shift}" style="--span: {item.span}"><f:render partial="Kumano/LightboxLink" arguments="{image: image, class: 'chapter__image', sizes: '(width <= 600px) {f:if(condition: \'{orientation} == portrait\', then: \'50vw\', else: \'100vw\')}, calc({item.span} / 12 * min(100vw, 1328px))'}"/><f:if condition="{image.description}"><figcaption class="chapter__caption type-caption">{image.description}</figcaption></f:if></figure></f:if></f:for></f:for></f:variable><f:render partial="Kumano/Group" arguments="{tag: 'div', class: 'chapter__photos', body: photos}"/></div></section></f:section></html>
