<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'bleed-photo,lightbox'}"/><f:asset.script identifier="kumano-lightbox" src="EXT:kumano_kodo/Resources/Public/JavaScript/lightbox.js" type="module"/><f:for each="{record.image}" as="image" iteration="i"><f:if condition="{i.isFirst}"><f:variable name="caption">{record.bodytext -> f:or(alternative: image.description)}</f:variable><f:variable name="body"><a class="lightbox-link" href="{image.publicUrl}" data-lightbox aria-haspopup="dialog"><f:render partial="Kumano/Image" arguments="{image: image, class: 'bleed-photo__image', sizes: '100vw'}"/></a><f:if condition="{caption}"><figcaption class="bleed-photo__caption type-caption">{caption}</figcaption></f:if></f:variable><f:render partial="Kumano/Group" arguments="{tag: 'figure', class: 'bleed-photo', body: body}"/></f:if></f:for></f:section></html>
