<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'place-card'}"/><f:variable name="body"><article class="place-card place-card--{record.tx_kumanokodo_variant}"><f:for each="{record.image}" as="image" iteration="i"><f:if condition="{i.isFirst}"><f:render partial="Kumano/Image" arguments="{image: image, class: 'place-card__image'}"/></f:if></f:for><h3 class="place-card__title {f:if(condition: '{record.tx_kumanokodo_variant} == featured', then: 'type-h3', else: 'type-h4')}">{record.header}</h3><p class="place-card__description type-small">{record.bodytext}</p></article></f:variable><f:render partial="Kumano/Section" arguments="{record: record, heading: 0, body: body, child: data.tx_kumanokodo_parent}"/></f:section></html>
