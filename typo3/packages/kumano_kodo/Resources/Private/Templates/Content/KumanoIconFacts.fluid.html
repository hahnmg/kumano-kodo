<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'icon-fact,section-heading'}"/><f:variable name="body"><div class="grid grid--{record.tx_kumanokodo_columns}"><f:for each="{record.tx_kumanokodo_items}" as="item"><div class="icon-fact"><span class="icon-circle"><f:render partial="Kumano/Icon" arguments="{name: item.icon, size: 24}"/></span><div class="icon-fact__text"><p class="icon-fact__label type-label">{item.label}</p><p class="icon-fact__value type-button">{item.value}</p><f:if condition="{item.note}"><p class="icon-fact__note type-caption">{item.note}</p></f:if></div></div></f:for></div></f:variable><f:render partial="Kumano/Section" arguments="{record: record, heading: 1, body: body, child: data.tx_kumanokodo_parent}"/></f:section></html>
