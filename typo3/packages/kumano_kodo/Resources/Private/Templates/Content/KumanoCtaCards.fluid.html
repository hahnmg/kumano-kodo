<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'cta-card,section-heading'}"/><f:variable name="readMore">{f:translate(key: 'readMore', domain: 'kumano_kodo.messages')}</f:variable><f:variable name="body"><div class="grid grid--{record.tx_kumanokodo_columns}"><f:for each="{record.tx_kumanokodo_items}" as="item"><f:variable name="label">{item.link_label -> f:or(alternative: readMore)}</f:variable><article class="cta-card cta-card--{item.variant}"><h3 class="cta-card__title type-h4">{item.title}</h3><p class="cta-card__text type-small">{item.text}</p><div class="cta-card__link"><f:render partial="Kumano/Link" arguments="{label: label, href: '{f:uri.typolink(parameter: item.link)}'}"/></div></article></f:for></div></f:variable><f:render partial="Kumano/Section" arguments="{record: record, heading: 1, body: body, child: data.tx_kumanokodo_parent}"/></f:section></html>
