<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'figure,lightbox'}"/><f:asset.script identifier="kumano-lightbox" src="EXT:kumano_kodo/Resources/Public/JavaScript/lightbox.js" type="module"/><f:variable name="body"><f:variable name="count">{record.image -> f:count()}</f:variable><f:variable name="class">figure figure--{f:if(condition: '{count} == 2', then: 'pair', else: 'default')}<f:if condition="!{record.tx_kumanokodo_rule}"> figure--unruled</f:if></f:variable><f:variable name="caption"><f:if condition="{record.bodytext}"><f:then>{record.bodytext}</f:then><f:else><f:for each="{record.image}" as="first" iteration="i"><f:if condition="{i.isFirst}">{first.description}</f:if></f:for></f:else></f:if></f:variable><f:variable name="body"><div class="figure__images"><f:for each="{record.image}" as="image"><f:render partial="Kumano/LightboxLink" arguments="{image: image, class: 'figure__image'}"/></f:for></div><figcaption class="figure__caption type-caption">{caption}</figcaption></f:variable><f:render partial="Kumano/Group" arguments="{tag: 'figure', class: class, body: body}"/></f:variable><f:render partial="Kumano/Section" arguments="{record: record, heading: 0, body: body, child: data.tx_kumanokodo_parent}"/></f:section></html>
