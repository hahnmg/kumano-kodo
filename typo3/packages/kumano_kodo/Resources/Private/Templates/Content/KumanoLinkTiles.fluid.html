<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'link-tile,section-heading'}"/><f:variable name="body"><div class="grid grid--{record.tx_kumanokodo_columns}"><f:for each="{record.tx_kumanokodo_items}" as="item"><a class="link-tile" href="{f:uri.typolink(parameter: item.link)}"><span class="icon-circle"><f:render partial="Kumano/Icon" arguments="{name: item.icon, size: 24}"/></span><span class="link-tile__title type-h4">{item.title}</span><f:render partial="Kumano/Icon" arguments="{name: 'arrow-right', size: 24}"/></a></f:for></div></f:variable><f:render partial="Kumano/Section" arguments="{record: record, heading: 1, body: body, child: data.tx_kumanokodo_parent}"/></f:section></html>
