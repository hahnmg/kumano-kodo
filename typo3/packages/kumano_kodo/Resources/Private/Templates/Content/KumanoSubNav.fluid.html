<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'sub-nav'}"/><f:variable name="body"><f:variable name="current">{f:uri.page()}</f:variable><nav class="sub-nav" aria-label="{record.header}"><h2 class="sub-nav__title type-h4">{record.header}</h2><ul class="sub-nav__list"><f:for each="{record.tx_kumanokodo_links}" as="entry"><f:variable name="href">{f:uri.typolink(parameter: entry.link)}</f:variable><li><f:if condition="{href} == {current}"><f:then><a class="sub-nav__link type-small" href="{href}" aria-current="page">{entry.label}</a></f:then><f:else><a class="sub-nav__link type-small" href="{href}">{entry.label}</a></f:else></f:if></li></f:for></ul></nav></f:variable><f:render partial="Kumano/Section" arguments="{record: record, heading: 0, body: body, child: data.tx_kumanokodo_parent}"/></f:section></html>
