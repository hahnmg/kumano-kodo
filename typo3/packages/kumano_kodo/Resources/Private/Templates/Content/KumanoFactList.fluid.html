<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'fact-list'}"/><f:variable name="body"><div class="fact-list fact-list--{record.tx_kumanokodo_variant}"><f:if condition="{record.header}"><h2 class="fact-list__title type-h4">{record.header}</h2></f:if><dl class="fact-list__items"><f:for each="{record.tx_kumanokodo_items}" as="fact"><div class="fact-list__row"><dt class="type-caption">{fact.label}</dt><dd class="{f:if(condition: '{record.tx_kumanokodo_variant} == inline', then: 'type-small', else: 'type-button')}">{fact.value}</dd></div></f:for></dl></div></f:variable><f:render partial="Kumano/Section" arguments="{record: record, heading: 0, body: body, child: data.tx_kumanokodo_parent}"/></f:section></html>
