<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'faq-item,section-heading'}"/><f:variable name="body"><f:variable name="list"><div class="faq-list"><f:for each="{record.tx_kumanokodo_questions}" as="item"><f:if condition="{item.open}"><f:then><details class="faq-item" open></f:then><f:else><details class="faq-item"></f:else></f:if><summary class="faq-item__question"><span class="type-h4-regular">{item.question}</span><f:render partial="Kumano/Icon" arguments="{name: 'chevron-down', size: 20}"/></summary><p class="faq-item__answer type-body">{item.answer}</p></details></f:for></div></f:variable><f:if condition="{record.header} && {data.header_layout} != 100"><f:then><f:variable name="first"><f:if condition="{record.bodytext}"><f:then><div class="stack" style="--stack-gap: var(--space-16)"><f:render partial="Kumano/SectionHeading" arguments="{title: record.header, eyebrow: record.subheader}"/><div class="rich-text"><p>{record.bodytext}</p></div></div></f:then><f:else><f:render partial="Kumano/SectionHeading" arguments="{title: record.header, eyebrow: record.subheader}"/></f:else></f:if></f:variable><f:render partial="Kumano/Split" arguments="{first: first, second: list, ratio: 'heading-content'}"/></f:then><f:else>{list -> f:format.raw()}</f:else></f:if></f:variable><f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 0, bleed: 0, body: body}"/></f:section></html>
