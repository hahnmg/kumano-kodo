<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Theme/Components" data-namespace-typo3-fluid="true">
<f:layout name="Content/Default"/>
<f:section name="Main">
    <f:variable name="list">
        <kk:faqList>
            <f:for each="{record.tx_kumanokodo_questions}" as="item">
                <kk:faqItem question="{item.question}" answer="{item.answer}" open="{item.open}"/>
            </f:for>
        </kk:faqList>
    </f:variable>
    <f:if condition="{record.header} && {data.header_layout} != 100">
        <f:then>
            <f:variable name="body">
                <kk:split ratio="heading-content">
                    <f:fragment name="first">
                        <f:if condition="{record.bodytext}">
                            <f:then>
                                <kk:stack gap="16">
                                    <kk:sectionHeading title="{record.header}" eyebrow="{record.subheader}"/>
                                    <kk:richText>
                                        <f:format.html>{record.bodytext}</f:format.html>
                                    </kk:richText>
                                </kk:stack>
                            </f:then>
                            <f:else>
                                <kk:sectionHeading title="{record.header}" eyebrow="{record.subheader}"/>
                            </f:else>
                        </f:if>
                    </f:fragment>
                    <f:fragment name="second">{list -> f:format.raw()}</f:fragment>
                </kk:split>
            </f:variable>
        </f:then>
        <f:else>
            <f:variable name="body">{list -> f:format.raw()}</f:variable>
        </f:else>
    </f:if>
    <f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 0, bleed: 0, body: body}"/>
</f:section>
</html>
