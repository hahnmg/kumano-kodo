<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:k="http://typo3.org/ns/KumanoKodo/Sitepackage/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true"><f:layout name="Content/Default"/><f:section name="Main"><f:render partial="Kumano/Css" arguments="{names: 'newsletter-form,section-heading'}"/><f:variable name="body"><f:variable name="first"><f:if condition="{record.header}"><f:then><div class="stack" style="--stack-gap: var(--space-16)"><f:render partial="Kumano/SectionHeading" arguments="{title: record.header}"/><div class="rich-text"><f:format.html>{record.bodytext}</f:format.html></div></div></f:then><f:else><div class="rich-text"><f:format.html>{record.bodytext}</f:format.html></div></f:else></f:if></f:variable><f:variable name="form"><f:render partial="Kumano/NewsletterForm" arguments="{action: '{f:if(condition: settings.newsletterTarget, then: \'{f:uri.page(pageUid: settings.newsletterTarget)}\', else: \'#\')}', emailLabel: '{f:translate(key: \'emailAddress\', domain: \'kumano_kodo.messages\')}', placeholder: '{f:translate(key: \'emailPlaceholder\', domain: \'kumano_kodo.messages\')}', consent: '{f:translate(key: \'consent\', domain: \'kumano_kodo.messages\')}', submit: '{f:translate(key: \'subscribe\', domain: \'kumano_kodo.messages\')}'}"/></f:variable><f:render partial="Kumano/Split" arguments="{first: first, second: form, ratio: 'text-media'}"/></f:variable><f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 0, bleed: 0, body: body}"/></f:section></html>
