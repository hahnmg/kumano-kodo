<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>The Form molecule: fields in one column, the note on required fields, the button.</f:comment>
<formvh:renderRenderable renderable="{form}">
<formvh:form object="{form}" action="{form.renderingOptions.controllerAction}" method="{form.renderingOptions.httpMethod}" id="{form.identifier}" section="{form.identifier}" enctype="{form.renderingOptions.httpEnctype}" addQueryString="{form.renderingOptions.addQueryString}" argumentsToBeExcludedFromQueryString="{form.renderingOptions.argumentsToBeExcludedFromQueryString}" additionalParams="{form.renderingOptions.additionalParams}" additionalAttributes="{formvh:translateElementProperty(element: form, property: 'fluidAdditionalAttributes')}" class="form">
<f:render partial="{form.currentPage.templateName}" arguments="{page: form.currentPage}"/>
<p class="form__note type-caption">{f:translate(key: 'requiredNote', domain: 'kumano_kodo.messages')}</p>
<div><f:render partial="Form/Navigation" arguments="{form: form}"/></div>
</formvh:form>
</formvh:renderRenderable>
</html>
