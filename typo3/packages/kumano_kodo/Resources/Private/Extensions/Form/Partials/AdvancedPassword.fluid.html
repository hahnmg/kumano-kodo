<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Sitepackage/Components" data-namespace-typo3-fluid="true">
<f:comment>Two text fields, password and confirmation; the error and the description sit under the first.</f:comment>
<formvh:renderRenderable renderable="{element}">
    <f:form.validationResults for="{element.rootForm.identifier}.{element.identifier}">
        <f:if condition="{element.properties.elementDescription}"><f:variable name="aria" value="{describedby: '{element.uniqueIdentifier}-desc'}"/></f:if>
        <f:if condition="{validationResults.errors}"><f:variable name="aria" value="{invalid: 'true', describedby: '{element.uniqueIdentifier}-errors'}"/></f:if>
        <f:variable name="required"><f:if condition="{element.required}"><f:render partial="Field/Required" arguments="{element: element}"/></f:if></f:variable>
        <div class="form-password">
            <div class="field">
                <label class="field-label type-label" for="{element.uniqueIdentifier}">{formvh:translateElementProperty(element: element, property: 'label')}{required -> f:format.raw()}</label>
                <span class="field-box"><f:form.password property="{element.identifier}.password" id="{element.uniqueIdentifier}" class="{element.properties.elementClassAttribute}" additionalAttributes="{formvh:translateElementProperty(element: element, property: 'fluidAdditionalAttributes')}" aria="{aria}"/></span>
                <f:if condition="{validationResults.errors}"><span id="{element.uniqueIdentifier}-errors" class="field-error type-caption" role="alert"><kk:icon name="alert" size="16"/><f:for each="{validationResults.errors}" as="message" iteration="i"><f:if condition="{i.isFirst}">{formvh:translateElementError(element: element, error: message)}</f:if></f:for></span></f:if>
                <f:if condition="{element.properties.elementDescription}"><span id="{element.uniqueIdentifier}-desc" class="field-description type-caption">{formvh:translateElementProperty(element: element, property: 'elementDescription')}</span></f:if>
            </div>
            <div class="field">
                <label class="field-label type-label" for="{element.uniqueIdentifier}-confirmation">{formvh:translateElementProperty(element: element, property: 'confirmationLabel')}{required -> f:format.raw()}</label>
                <span class="field-box"><f:form.password property="{element.identifier}.confirmation" id="{element.uniqueIdentifier}-confirmation" class="{element.properties.confirmationClassAttribute}" additionalAttributes="{formvh:translateElementProperty(element: element, property: 'fluidAdditionalAttributes')}" aria="{aria}"/></span>
            </div>
        </div>
    </f:form.validationResults>
</formvh:renderRenderable>
</html>
