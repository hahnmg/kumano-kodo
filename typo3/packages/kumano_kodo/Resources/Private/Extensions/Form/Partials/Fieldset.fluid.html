<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>A group of fields under a legend set as an H4.</f:comment>
<formvh:renderRenderable renderable="{element}">
    <fieldset id="{element.uniqueIdentifier}" class="form-fieldset">
        <f:if condition="{element.label}"><legend class="form-fieldset-legend type-h4">{formvh:translateElementProperty(element: element, property: 'label')}</legend></f:if>
        <f:for each="{element.elements}" as="child"><f:render partial="{child.templateName}" arguments="{element: child}"/></f:for>
    </fieldset>
</formvh:renderRenderable>
</html>
