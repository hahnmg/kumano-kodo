name: kumano-kodo/form
label: 'Kumano Kodo — form markup'
priority: 50

persistenceManager:
  allowedExtensionPaths:
    20: 'EXT:kumano_kodo/Resources/Private/Forms/'
    # The demo's own forms: a contact form with a topic, and the walk registration with every element type.
    30: 'EXT:kumano_kodo/Resources/Private/Forms/Demo/'

prototypes:
  standard:
    finishersDefinition:
      Confirmation:
        options:
          templateRootPaths:
            100: 'EXT:kumano_kodo/Resources/Private/Extensions/Form/Templates/Finishers/Confirmation/'
    formElementsDefinition:
      Form:
        renderingOptions:
          translation:
            translationFiles:
              15: 'EXT:kumano_kodo/Resources/Private/Language/form.xlf'
          templateRootPaths:
            100: 'EXT:kumano_kodo/Resources/Private/Extensions/Form/Templates/'
          partialRootPaths:
            100: 'EXT:kumano_kodo/Resources/Private/Extensions/Form/Partials/'
            110: 'EXT:kumano_kodo/Resources/Private/Templates/Partials/'
          fieldProperties:
            errorClassAttribute: ''
          formNavigation:
            navigationWrapperClassAttribute: ''
            navigationClassAttribute: form-navigation
            btnPreviousClassAttribute: 'button type-button button-secondary'
            btnNextClassAttribute: 'button type-button button-primary'
            btnSubmitClassAttribute: 'button type-button button-primary'
      Text:
        properties:
          elementClassAttribute: 'field-control type-lead'
      Email:
        properties:
          elementClassAttribute: 'field-control type-lead'
      Telephone:
        properties:
          elementClassAttribute: 'field-control type-lead'
      Textarea:
        properties:
          elementClassAttribute: 'field-control field-control-textarea type-small'
      SingleSelect:
        properties:
          elementClassAttribute: 'field-control field-control-select type-small'
      Checkbox:
        properties:
          elementClassAttribute: choice-input
      Url:
        properties:
          elementClassAttribute: 'field-control type-lead'
      Number:
        properties:
          elementClassAttribute: 'field-control type-lead'
      Date:
        properties:
          elementClassAttribute: 'field-control type-lead'
      Password:
        properties:
          elementClassAttribute: 'field-control type-lead'
      AdvancedPassword:
        properties:
          elementClassAttribute: 'field-control type-lead'
          confirmationClassAttribute: 'field-control type-lead'
      # The calendar of the core needs jQuery UI, which the theme does not load; without it the field stays read-only.
      DatePicker:
        properties:
          elementClassAttribute: 'field-control type-lead'
          containerClassAttribute: ''
          enableDatePicker: false
      CountrySelect:
        properties:
          elementClassAttribute: 'field-control field-control-select type-small'
      MultiSelect:
        properties:
          elementClassAttribute: 'field-control field-control-multiple type-small'
      ContentElement:
        properties:
          outerContainerClassAttribute: form-content
