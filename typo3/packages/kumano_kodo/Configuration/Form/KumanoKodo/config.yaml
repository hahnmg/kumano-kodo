name: kumano-kodo/form
label: 'Kumano Kodo — form markup'
priority: 50

prototypes:
  standard:
    finishersDefinition:
      Confirmation:
        options:
          templateRootPaths:
            100: 'EXT:kumano_kodo/Resources/Private/Extensions/Form/Templates/Finishers/Confirmation/'
    formElementsDefinition:
      Form:
        renderingOptions:
          translation:
            translationFiles:
              15: 'EXT:kumano_kodo/Resources/Private/Language/form.xlf'
          templateRootPaths:
            100: 'EXT:kumano_kodo/Resources/Private/Extensions/Form/Templates/'
          partialRootPaths:
            100: 'EXT:kumano_kodo/Resources/Private/Extensions/Form/Partials/'
            110: 'EXT:kumano_kodo/Resources/Private/Templates/Partials/'
          fieldProperties:
            errorClassAttribute: ''
          formNavigation:
            navigationWrapperClassAttribute: ''
            navigationClassAttribute: ''
            btnPreviousClassAttribute: 'button type-button button--primary'
            btnNextClassAttribute: 'button type-button button--primary'
            btnSubmitClassAttribute: 'button type-button button--primary'
      Text:
        properties:
          elementClassAttribute: 'field__control type-lead'
      Email:
        properties:
          elementClassAttribute: 'field__control type-lead'
      Telephone:
        properties:
          elementClassAttribute: 'field__control type-lead'
      Textarea:
        properties:
          elementClassAttribute: 'field__control field__control--textarea type-small'
      SingleSelect:
        properties:
          elementClassAttribute: 'field__control field__control--select type-small'
      Checkbox:
        properties:
          elementClassAttribute: choice__input
