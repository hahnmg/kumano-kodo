services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  KumanoKodo\Sitepackage\:
    resource: '../Classes/*'

  KumanoKodo\Sitepackage\DataProcessing\ThemeProcessor:
    tags:
      - name: data.processor
        identifier: kumano-theme

  KumanoKodo\Sitepackage\DataProcessing\ChapterNumberProcessor:
    tags:
      - name: data.processor
        identifier: kumano-chapter-number

  KumanoKodo\Sitepackage\DataProcessing\StructuredDataProcessor:
    tags:
      - name: data.processor
        identifier: kumano-structured-data
