services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  KumanoKodo\Theme\:
    resource: '../Classes/*'

  KumanoKodo\Theme\DataProcessing\ThemeProcessor:
    tags:
      - name: data.processor
        identifier: kumano-theme

  KumanoKodo\Theme\DataProcessing\StructuredDataProcessor:
    tags:
      - name: data.processor
        identifier: kumano-structured-data

  KumanoKodo\Theme\DataProcessing\ChapterNumberProcessor:
    tags:
      - name: data.processor
        identifier: kumano-chapter-number
