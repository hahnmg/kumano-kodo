# Generated by scripts/export-demo.mjs. kumano:demo:build fills in contentElementUid and stores the form in the form database.
identifier: walk
label: Register a walk
type: Form
prototypeName: standard
renderingOptions:
  submitButtonLabel: Send registration
  translation:
    translationFiles:
      '20': EXT:kumano_kodo_demo/Resources/Private/Language/form_walk.xlf
finishers:
  - identifier: Confirmation
    options:
      message: Thank you. We will write to you within a week.
renderables:
  - identifier: about
    type: Page
    label: About you
    renderingOptions:
      previousButtonLabel: Back
      nextButtonLabel: Next
    renderables:
      - identifier: intro
        type: StaticText
        label: Before you set out
        properties:
          text: Tell us who walks, which route and when. We answer within a week.
      - identifier: name
        type: Text
        label: Name
        properties:
          fluidAdditionalAttributes:
            required: required
            autocomplete: name
        validators:
          - identifier: NotEmpty
      - identifier: email
        type: Email
        label: Email address
        properties:
          fluidAdditionalAttributes:
            required: required
            autocomplete: email
        validators:
          - identifier: NotEmpty
          - identifier: EmailAddress
      - identifier: phone
        type: Telephone
        label: Phone
        properties:
          fluidAdditionalAttributes:
            autocomplete: tel
      - identifier: website
        type: Url
        label: Blog or website
        properties:
          elementDescription: Where you write about the walk, if anywhere.
      - identifier: group
        type: Number
        label: Walkers in your group
        defaultValue: 2
        properties:
          fluidAdditionalAttributes:
            min: 1
            max: 12
      - identifier: dates
        type: GridRow
        label: ''
        renderables:
          - identifier: arrival-column
            type: GridColumn
            label: ''
            renderables:
              - identifier: arrival
                type: Date
                label: Arrival
          - identifier: departure-column
            type: GridColumn
            label: ''
            renderables:
              - identifier: departure
                type: DatePicker
                label: Departure
                properties:
                  dateFormat: d.m.Y
                  elementDescription: As day.month.year, for example 25.04.2024.
      - identifier: account
        type: Fieldset
        label: Your account
        renderables:
          - identifier: password
            type: Password
            label: Password
            properties:
              fluidAdditionalAttributes:
                autocomplete: current-password
          - identifier: new-password
            type: AdvancedPassword
            label: New password
            properties:
              confirmationLabel: Repeat the password
              fluidAdditionalAttributes:
                autocomplete: new-password
      - identifier: source
        type: Hidden
        label: ''
        defaultValue: demo
  - identifier: walk
    type: Page
    label: Your walk
    renderingOptions:
      previousButtonLabel: Back
      nextButtonLabel: Next
    renderables:
      - identifier: route
        type: RadioButton
        label: Route
        defaultValue: '1'
        properties:
          options:
            '1': Nakahechi
            '2': Kohechi
            '3': Iseji
            '4': Ohechi
      - identifier: pace
        type: SingleSelect
        label: Pace
        properties:
          options:
            '1': Slow
            '2': Steady
            '3': Brisk
      - identifier: interests
        type: MultiCheckbox
        label: What draws you
        properties:
          options:
            '1': Shrines
            '2': Hot springs
            '3': The forest
            '4': The food
      - identifier: languages
        type: MultiSelect
        label: Languages you speak
        properties:
          options:
            '1': English
            '2': German
            '3': Japanese
            '4': French
      - identifier: country
        type: CountrySelect
        label: Country you live in
        properties:
          prioritizedCountries:
            - DE
            - JP
      - identifier: luggage
        type: ContentElement
        label: ''
        properties:
          contentElementUid: 964
      - identifier: notes
        type: Textarea
        label: Anything else
        properties:
          fluidAdditionalAttributes:
            rows: 4
      - identifier: consent
        type: Checkbox
        label: I agree that my details are used to plan the walk.
        properties:
          value: 1
          fluidAdditionalAttributes:
            required: required
        validators:
          - identifier: NotEmpty
  - identifier: photos
    type: Page
    label: Photos
    renderingOptions:
      previousButtonLabel: Back
      nextButtonLabel: Next
    renderables:
      - identifier: photo
        type: ImageUpload
        label: A photo of you
        properties:
          saveToFileMount: 1:/user_upload/
          allowedMimeTypes:
            - image/jpeg
            - image/png
          allowRemoval: true
          elementDescription: JPG or PNG.
      - identifier: route-file
        type: FileUpload
        label: Your route as PDF
        properties:
          saveToFileMount: 1:/user_upload/
          allowedMimeTypes:
            - application/pdf
          allowRemoval: true
          elementDescription: A PDF of your planned stages.
  - identifier: summary
    type: SummaryPage
    label: Check your details
    renderingOptions:
      previousButtonLabel: Back
      nextButtonLabel: Next
