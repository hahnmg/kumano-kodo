<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:kk="http://typo3.org/ns/KumanoKodo/Sitepackage/Components" xmlns:kkd="http://typo3.org/ns/KumanoKodo/Demo/Components" data-namespace-typo3-fluid="true">
<f:layout name="Content/Default"/>
<f:section name="Main">
    <f:variable name="body">
        <kkd:routeMap
            label="{record.bodytext -> f:format.stripTags() -> f:format.trim()}"
            path="{record.tx_kumanokodo_path}"
            stations="{record.tx_kumanokodo_stations}"
            days="{record.tx_kumanokodo_day_marks}"
        />
    </f:variable>
    <f:render partial="Kumano/Section" arguments="{record: record, data: data, heading: 1, bleed: 0, body: body}"/>
</f:section>
</html>
